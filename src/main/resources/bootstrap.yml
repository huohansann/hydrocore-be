spring:
  profiles:
    active: dev
  application:
    name: hydrocore
  cloud:
    nacos:
      # Local default. Override server-addr and namespace per environment.
      server-addr: localhost:8848
      username: nacos
      password: 123456
      # Nacos namespace ID. Create/use a HydroCore namespace for this baseline.
      namespace: hydrocore
      discovery:
        namespace: ${spring.cloud.nacos.namespace}
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        file-extension: yml
        namespace: ${spring.cloud.nacos.namespace}
        server-addr: ${spring.cloud.nacos.server-addr}
        # Templates live in src/main/resources/nacos/.
        # Publish them with scripts/publish-nacos-configs.ps1.
        extension-configs:
          - data-id: hydrocore.yml
            refresh: true
          - data-id: redis.yml
            refresh: true
          - data-id: mybatis-plus.yml
            refresh: true
          - data-id: pagehelper.yml
            refresh: true
          - data-id: hydrocore-constant.yml
            refresh: true
          - data-id: sec-knife4j.yml
            refresh: true
          - data-id: hydrocore-config.properties
            refresh: true
